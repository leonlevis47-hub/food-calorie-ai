<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodLens AI Pro - Smart Nutrition Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --primary: #10b981;
      --primary-hover: #34d399;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    
    .app-card { width: 100%; max-width: 480px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 24px; padding: 28px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    .header { text-align: center; margin-bottom: 24px; }
    .badge { background: rgba(16,185,129,0.12); color: var(--primary); padding: 5px 12px; border-radius: 99px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; border: 1px solid rgba(16,185,129,0.25); text-transform: uppercase; }
    h1 { font-size: 26px; font-weight: 700; margin-top: 10px; color: #ffffff; }
    p.sub { color: var(--text-sub); font-size: 13px; margin-top: 4px; }

    .drop-zone { border: 2px dashed var(--border); border-radius: 16px; padding: 24px; text-align: center; cursor: pointer; transition: all 0.2s; background: rgba(15, 23, 42, 0.4); position: relative; overflow: hidden; }
    .drop-zone:hover { border-color: var(--primary); background: rgba(16,185,129,0.05); }
    #imageInput { display: none; }
    #preview { width: 100%; max-height: 250px; border-radius: 12px; display: none; object-fit: cover; }
    
    .btn-submit { width: 100%; padding: 16px; background: var(--primary); color: #022c22; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; margin-top: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-submit:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Custom Toast Notification */
    #toast { visibility: hidden; min-width: 280px; background-color: #ef4444; color: #fff; text-align: center; border-radius: 12px; padding: 14px 18px; position: fixed; z-index: 100; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 13px; font-weight: 600; box-shadow: 0 10px 25px rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.3s, visibility 0.3s; }
    #toast.show { visibility: visible; opacity: 1; }

    /* Result Dashboard UI */
    #result { display: none; margin-top: 24px; border-top: 1px solid var(--border); padding-top: 20px; }
    .grid-macro { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
    .card-macro { background: #0f172a; padding: 12px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
    .card-macro.main { grid-column: span 3; background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.3); }
    .macro-lbl { font-size: 10px; color: var(--text-sub); font-weight: 700; text-transform: uppercase; }
    .macro-val { font-size: 16px; font-weight: 700; color: var(--primary); margin-top: 2px; }
    .card-macro.main .macro-val { font-size: 28px; }
    .details-box { background: #0f172a; border: 1px solid var(--border); padding: 16px; border-radius: 12px; margin-top: 12px; font-size: 13.5px; color: #cbd5e1; line-height: 1.6; white-space: pre-line; }

    /* Loading Spinner */
    .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <span class="badge">AI Engine v2.0 Pro</span>
      <h1>FoodLens AI</h1>
      <p class="sub">วิเคราะห์แคลอรีและสารอาหารจากรูปถ่าย</p>
    </div>

    <div class="drop-zone" onclick="document.getElementById('imageInput').click()">
      <img id="preview" alt="Food Preview">
      <div id="uploadPrompt">
        <p style="font-size: 15px; font-weight: 600; color: #e2e8f0;">📸 คลิกเพื่อเลือกรุปอาหาร</p>
        <p style="font-size: 12px; color: var(--text-sub); margin-top: 4px;">ระบบจะย่อขนาดรูปเพื่อประมวลผลความเร็วสูง</p>
      </div>
      <input type="file" id="imageInput" accept="image/*" onchange="handleFileSelect(event)">
    </div>

    <button id="btnAnalyze" class="btn-submit" onclick="startAnalysis()">
      <span>⚡ วิเคราะห์โภชนาการ</span>
    </button>

    <div id="result">
      <h3 style="color: #ffffff; font-size: 16px;">📊 ผลการวิเคราะห์</h3>
      <div class="grid-macro">
        <div class="card-macro main">
          <div class="macro-lbl">พลังงานรวม (Energy)</div>
          <div class="macro-val" id="resCal">-</div>
        </div>
        <div class="card-macro">
          <div class="macro-lbl">โปรตีน</div>
          <div class="macro-val" id="resProtein">-</div>
        </div>
        <div class="card-macro">
          <div class="macro-lbl">คาร์บ</div>
          <div class="macro-val" id="resCarb">-</div>
        </div>
        <div class="card-macro">
          <div class="macro-lbl">ไขมัน</div>
          <div class="macro-val" id="resFat">-</div>
        </div>
      </div>
      <div class="details-box" id="resDetails"></div>
    </div>
  </div>

  <div id="toast">แจ้งเตือนระบบ</div>

  <script>
    let compressedBase64 = "";

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.innerText = msg;
      t.className = "show";
      setTimeout(() => { t.className = t.className.replace("show", ""); }, 4000);
    }

    // ย่อขนาดรูปภาพอัตโนมัติเพื่อความเร็วสูงสุด
    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const MAX_WIDTH = 800; 
          let width = img.width;
          let height = img.height;

          if (width > MAX_WIDTH) {
            height *= MAX_WIDTH / width;
            width = MAX_WIDTH;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          const dataUrl = canvas.toDataURL("image/jpeg", 0.75);
          document.getElementById('preview').src = dataUrl;
          document.getElementById('preview').style.display = 'block';
          document.getElementById('uploadPrompt').style.display = 'none';

          compressedBase64 = dataUrl.split(',')[1];
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function startAnalysis() {
      if (!compressedBase64) { showToast("กรุณาเลือกรูปภาพอาหารก่อนครับ"); return; }

      const btn = document.getElementById('btnAnalyze');
      const resultDiv = document.getElementById('result');

      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span> <span>กำลังวิเคราะห์...</span>`;
      resultDiv.style.display = 'none';

      try {
        const res = await fetch('/analyze', {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: compressedBase64, mimeType: "image/jpeg" })
        });
        
        const resData = await res.json();

        if (resData.error) {
          showToast(resData.error);
        } else {
          document.getElementById('resCal').innerText = resData.data.calories || "-";
          document.getElementById('resProtein').innerText = resData.data.protein || "-";
          document.getElementById('resCarb').innerText = resData.data.carbs || "-";
          document.getElementById('resFat').innerText = resData.data.fat || "-";
          document.getElementById('resDetails').innerText = resData.data.details || "";
          resultDiv.style.display = 'block';
        }
      } catch (err) {
        showToast("ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>⚡ วิเคราะห์โภชนาการ</span>`;
      }
    }
  </script>
</body>
</html>
